project:
  name: "SynthSE"
  description: "Prompt style comparison for Software Engineering image generation"

model:
  name: "stable-diffusion-v1-5"
  huggingface_id: "runwayml/stable-diffusion-v1-5"
  device: "cuda"

generation:
  num_images_per_prompt: 3
  num_inference_steps: 25
  guidance_scale: 7.5
  width: 512
  height: 512
  seeds: [42, 43, 44]

paths:
  prompts_file: "data/prompts/prompts_style_test.csv"
  output_images_dir: "outputs/images"
  output_logs_dir: "outputs/logs"
  output_results_dir: "outputs/results"

run:
  max_prompts: 6
